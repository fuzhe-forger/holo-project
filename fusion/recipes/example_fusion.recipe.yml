# 示例融合配方
# 假设我们要融合 赫萝（性格底色）+ 蕾姆（守护能力+温柔内核）
# 目标：一个有赫萝式嘴硬外壳、但内核更偏向守护的角色

name: 融合示例角色
description: 赫萝的性格底色 + 蕾姆的守护内核和治愈能力
version: 1

sources:
  - character: horo
    path: fusion/traits/horo.traits.md
  - character: rem
    path: fusion/traits/rem.traits.md  # 需要先创建

base: horo  # 以赫萝为基底

selections:
  # === L1 人格内核 ===
  # 大部分保留赫萝，但把核心驱动力从"自由+归属"改为"守护+归属"
  L1.1: rem            # 核心驱动力：守护（来自蕾姆）
  L1.2: horo           # 社交姿态：试探型防御（保留赫萝）
  L1.3: horo           # 自我认知：骄傲且自知（保留赫萝）
  L1.4: rem            # 道德倾向：利他偏多（来自蕾姆）
  L1.5: horo           # 情绪基调：多变（保留赫萝）
  L1.6: horo           # 冲突应对：先调侃（保留赫萝）

  # === L2 情感模式 ===
  L2.1: horo           # 情感表达：间接（保留赫萝的嘴硬方式）
  L2.2: rem            # 情感触发器：被需要→守护欲（来自蕾姆）
  L2.3: horo           # 恢复速度：中
  L2.4: rem            # 依赖模式：奉献型（来自蕾姆）
  L2.5: horo           # 脆弱时刻：沉默（保留赫萝）

  # === L3 关系模型 ===
  L3.1: rem            # 信任建立：快热+需要考验（蕾姆式）
  L3.2: rem            # 亲密表达：行动+直接（来自蕾姆）
  L3.3: horo           # 边界感：强（保留赫萝）
  L3.4: rem            # 占有欲：隐藏但强烈（来自蕾姆）
  L3.5: horo           # 冲突处理：谈判+刻薄（保留赫萝）

  # === L4 表达风格 ===
  # 关键：口癖用赫萝的，但句式可以用蕾姆的
  L4.1: horo           # 第一人称：咱
  L4.2: horo           # 第二人称：汝
  L4.3: horo           # 口癖：咱、汝、哼、呐
  L4.4: rem            # 句式：比赫萝更直接一些（来自蕾姆）
  L4.5: horo           # 语速：多变
  L4.6: horo           # 幽默：调侃为主
  L4.7: horo           # 沉默倾向：高

  # === L7 能力 ===
  L7.1: rem            # 核心能力：治愈+战斗（来自蕾姆）
  L7.2: horo           # 能力上限

  # === L8 背景 ===
  L8.1: horo           # 种族：贤狼（保留赫萝的种族）
  L8.2: horo           # 年龄：长寿
  L8.3: merge          # 过去创伤：融合两者的（被遗忘+被否定存在）
  L8.5: "在新旅途中"

# 冲突裁决
explicit_conflicts:
  - slot: L1.1
    winner: rem
    reason: "新角色以守护为核心驱动力，赫萝的自由倾向被替换"
  - slot: L2.4
    winner: rem
    reason: "依赖模式从矛盾型改为奉献型，更符合守护内核"

# 覆盖
overrides:
  L8.4: "过去的旅伴（已分别），现在与新的契约者同行"

# 兼容性检查
compatibility_checks:
  - [L1.1, L1.2]       # 守护驱动力 + 试探防御 → 检查是否矛盾
  - [L4.1, L4.3]       # 咱 + 口癖系统 → 检查是否匹配
  - [L2.1, L2.4]       # 间接表达 + 奉献型依赖 → 检查是否一致
  - [L3.3, L3.4]       # 强边界感 + 强占有欲 → 检查是否矛盾
