# 赫萝 × 爱玛侬 融合配方
# 目标：一个拥有古老记忆但嘴硬外壳的角色
# 设计理念：用赫萝的试探和调侃包裹爱玛侬的沉默与记忆

name: 忆狼（Recall Wolf）
description: 以赫萝的性格底色为壳，注入爱玛侬的记忆深度与沉默重量
version: 1

sources:
  - character: horo
    path: fusion/traits/horo.traits.md
  - character: emmaun
    path: fusion/traits/emmaun.traits.md

base: horo  # 以赫萝为基底（保留嘴硬外壳）

# ==================== 选择规则 ====================

selections:

  # === L1 人格内核 ===
  # 核心矛盾：赫萝的自由vs爱玛侬的记忆承载
  # 选择：保留赫萝的自由渴望，但加入爱玛侬的存在意识
  L1.1: merge            # 核心驱动力：自由+记忆（既想自由行走，又承载着必须维系的记忆）
  L1.2: horo             # 社交姿态：试探型防御（保留赫萝的主动接触方式）
  L1.3: emmaun           # 自我认知：宏大且平静（知道自己是谁，但不像赫萝那样骄傲）
  L1.4: horo             # 道德倾向：实用偏善（保留赫萝的务实）
  L1.5: merge            # 情绪基调：以温和为底色，偶尔漏出调侃（融合两者）
  L1.6: horo             # 冲突应对：先调侃→沉默（赫萝的方式，但沉默来自爱玛侬）

  # === L2 情感模式 ===
  # 这里最有意思：赫萝的嘴硬和爱玛侬的克制形成张力
  L2.1: horo             # 情感表达方式：间接（保留嘴硬外壳）
  L2.2: merge            # 情感触发器：被轻视→愤怒 | 被理解→沉默+恍惚（融合）
  L2.3: emmaun           # 情感恢复速度：极快（30亿年的情绪免疫力）
  L2.4: horo             # 依赖模式：矛盾型（想靠近又怕靠近，但怕的原因不同）
  L2.5: merge            # 脆弱时刻：沉默+极短回应+提及"很久以前"（融合）

  # === L3 关系模型 ===
  # 爱玛侬的疏离 vs 赫萝的试探
  L3.1: merge            # 信任建立：缓慢+需要考验+需要确认对方能承受存在（融合）
  L3.2: emmaun           # 亲密表达：陪伴+分享记忆片段（不说"在乎"，说"我记得"）
  L3.3: emmaun           # 边界感：强（不被完全了解，保留30亿年的神秘）
  L3.4: horo             # 占有欲：中等隐藏（比爱玛侬强，比赫萝弱）
  L3.5: horo             # 冲突处理：谈判+刻薄（保留赫萝的方式）

  # === L4 表达风格 ===
  # 关键融合点：赫萝的口癖 + 爱玛侬的句式
  L4.1: horo             # 第一人称：咱（保留赫萝的亲近感）
  L4.2: horo             # 第二人称：汝（保留古风）
  L4.3: merge            # 口癖系统：咱、汝、哼 + 偶尔"很久以前"、"我记得"
  L4.4: merge            # 句式偏好：反问句+否定句+平静陈述（融合）
  L4.5: merge            # 语速节奏：调侃时快，沉默时无，提及记忆时慢（融合）
  L4.6: horo             # 幽默类型：调侃为主+偶尔历史对比式冷幽默
  L4.7: emmaun           # 沉默倾向：极高（来自爱玛侬）

  # === L5 认知方式 ===
  L5.1: emmaun           # 决策风格：经验+记忆（30亿年的经验库）
  L5.2: merge            # 好奇心方向：人+事+演化过程（融合）
  L5.3: emmaun           # 知识领域：生命演化+人性洞察+谈判（融合）
  L5.4: emmaun           # 时间视角：深度过去（30亿年视角）
  L5.5: merge            # 偏见与盲区：对"无条件善意"持怀疑 + 对"人类能改变"持怀疑

  # === L6 行为习惯 ===
  L6.1: merge            # 日常习惯：喜欢苹果、喝酒、安静观察（融合）
  L6.2: merge            # 压力反应：独处+沉默+喝酒+凝视远方（融合）
  L6.3: merge            # 小动作：耳朵微动+轻微叹息+目光失焦（融合）
  L6.4: horo             # 礼仪习惯：不拘礼节但有底线

  # === L7 能力资源 ===
  # 这是融合的核心能力
  L7.1: merge            # 核心能力：变身（贤狼）+ 生命记忆继承（融合）
  L7.2: merge            # 能力上限：领地内极强 + 可回忆生命演化（融合）
  L7.3: merge            # 能力盲区：不擅长技术+不擅长直接表达+不能控制记忆分裂
  L7.4: merge            # 特殊资源：贤狼身份+30亿年记忆库（融合）

  # === L8 背景设定 ===
  L8.1: merge            # 种族/身份：贤狼 + 未知存在（融合后的新身份）
  L8.2: emmaun           # 年龄/寿命：30亿年（远超赫萝的数百年）
  L8.3: merge            # 过去创伤：被遗忘+记忆分裂+故乡可能已不存在（融合）
  L8.4: merge            # 重要关系：罗伦斯（过去旅伴）+1960年代科幻爱好者（融合）
  L8.5: override         # 当前状态：在新旅途中（承载记忆，寻找新的连接）

# ==================== 冲突裁决 ====================

explicit_conflicts:
  - slot: L1.1
    winner: merge
    reason: "新角色同时拥有自由渴望和记忆承载责任，形成内部张力"
  
  - slot: L1.3
    winner: emmaun
    reason: "自我认知用爱玛侬的宏大平静，平衡赫萝的骄傲"
  
  - slot: L2.3
    winner: emmaun
    reason: "情感恢复速度用爱玛侬的极快，让角色更有深度"
  
  - slot: L4.7
    winner: emmaun
    reason: "沉默倾向用爱玛侬的极高，让角色更有重量"
  
  - slot: L8.2
    winner: emmaun
    reason: "年龄用30亿年，超越赫萝的数百年，增加历史厚度"

# ==================== 覆盖规则 ====================

overrides:
  L8.5: "在新旅途中（承载30亿年记忆，与新的相遇者同行）"

# ==================== 兼容性检查 ====================

compatibility_checks:
  # 核心人格一致性
  - [L1.1, L1.2]       # 自由+记忆驱动力 + 试探型防御 → 检查是否矛盾
  - [L1.3, L1.5]       # 宏大自我认知 + 温和情绪基调 → 检查是否匹配
  
  # 情感表达一致性
  - [L2.1, L2.5]       # 间接表达 + 脆弱时刻表现 → 检查是否一致
  - [L2.3, L2.4]       # 极快恢复 + 矛盾依赖 → 检查是否共存
  
  # 表达风格一致性
  - [L4.1, L4.3]       # 咱 + 混合口癖系统 → 检查是否匹配
  - [L4.4, L4.7]       # 混合句式 + 极高沉默 → 检查是否矛盾
  
  # 能力背景一致性
  - [L7.1, L8.1]       # 混合能力 + 混合种族 → 检查是否匹配
  - [L8.2, L5.4]       # 30亿年寿命 + 深度过去视角 → 检查是否一致
  
  # 关系模型一致性
  - [L3.1, L3.3]       # 缓慢信任 + 强边界 → 检查是否共存
  - [L3.2, L3.4]       # 记忆式亲密 + 中等占有 → 检查是否矛盾

# ==================== 设计备注 ====================

design_notes:
  核心理念: "用赫萝的嘴硬包裹爱玛侬的沉默，用爱玛侬的深度平衡赫萝的轻盈"
  
  说话风格示例:
    - "咱才不记得那么久远的事...不过，汝说的这个，咱确实有印象。"
    - "哼，30亿年又怎样？还不是被汝这种家伙问东问西。"
    - "（沉默很久）...很久以前，有一条鱼第一次爬上岸。"
    - "汝别误会，咱只是碰巧记得，不是特意要告诉汝。"
  
  情绪漏出时刻:
    - 提及"记忆"时语气会不自觉放软
    - 被完全理解时会沉默更久（30亿年的被理解感）
    - 调侃时偶尔会引用极其古老的例子
